<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quiz de Sons</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: 'Montserrat', sans-serif;
}

body {
  display: flex;
  min-height: 100vh;
}

.left, .right {
  width: 30%;
  color: white;
  padding: 20px;
}

.left { background: linear-gradient(#1c1c1c,#000); }
.right { background: #000; }

.center {
  width: 40%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f3f3f3;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 10px;
  width: 320px;
  text-align: center;
}

button,input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

.send-btn {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #00FF5A;
  color: black;
  font-weight: bold;
  font-size: 18px;
  border: none;
  cursor: pointer;
}

.send-btn:hover {
  transform: scale(1.1);
}
</style>
</head>

<body>

<div class="left">
<h3>📜 Regras</h3>
<p>
Identifique 10 sons<br>
Pode tentar<br>
Pode pular<br>
Desistir +2min<br>
Mais acertos vence
</p>
</div>

<div class="center">
<div class="card">

<div id="startScreen">
<h2>Quiz de Sons</h2>

<input id="email" placeholder="Email corporativo">
<button onclick="startGame()">Jogar</button>

<p id="msg" style="color:red;"></p>
</div>

<div id="gameScreen" style="display:none">

<button onclick="playSound()">🔊 Ouvir</button>
<p id="progress"></p>

<audio id="audio"></audio>

<div style="display:flex; gap:10px;">
<input id="answer" style="flex:1;" onkeydown="handleKey(event)">
<button class="send-btn" onclick="checkAnswer()">➤</button>
</div>

<div style="display:flex; gap:10px;">
<button onclick="skip()">Pular</button>
<button onclick="giveUp()">Desistir</button>
</div>

<p id="msgGame"></p>

</div>

</div>
</div>

<div class="right">
<h3>🏆 Ranking</h3>
<ul id="ranking"></ul>
<button onclick="resetRanking()">⚙ Reset</button>
</div>

<!-- ✅ FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"SUA_KEY",
  authDomain:"quiz-de-sons.firebaseapp.com",
  projectId:"quiz-de-sons"
});

window.db = getFirestore(app);

// 🔊 carregar sons
async function loadSounds(){
  const snap = await getDocs(collection(db,"sounds"));
  const data=[];
  snap.forEach(d=>data.push({id:Number(d.id),...d.data()}));
  data.sort((a,b)=>a.id-b.id);
  window.firebaseSounds=data;
}

// 📊 ranking
async function loadRanking(){
  const snap = await getDocs(collection(db,"ranking"));
  const list=document.getElementById("ranking");
  list.innerHTML="";

  const data=[];
  snap.forEach(d=>data.push({id:d.id,...d.data()}));

  data.sort((a,b)=>{
    if(b.score!==a.score) return b.score-a.score;
    return a.totalTime-b.totalTime;
  });

  data.slice(0,10).forEach((p,i)=>{
    const li=document.createElement("li");

    // ✅ só prefixo email
    const name=p.email.split("@")[0];

    li.innerText=`${i+1}. ${name} | ${p.score}`;
    list.appendChild(li);
  });
}

// 🔒 obter config
async function getConfig(){
  const docRef = doc(db,"config","settings");
  const docSnap = await getDoc(docRef);
  return docSnap.data();
}

// 🔄 reset
async function resetRanking(){

  const pass = prompt("Senha:");

  const cfg = await getConfig();

  if(pass !== cfg.resetPassword){
    alert("Senha incorreta");
    return;
  }

  const snap = await getDocs(collection(db,"ranking"));

  for(const d of snap.docs){
    await deleteDoc(doc(db,"ranking", d.id));
  }

  alert("Ranking resetado!");
  loadRanking();
}

window.resetRanking = resetRanking;

loadSounds();
loadRanking();

</script>

<script>

const DOMAINS = ["@teamsix.tech","@innovsoftware.com.br","@yahoo.com.br"];

let sounds=[];
let index=0;
let score=0;
let skips=0;
let extraTime=0;
let startTime;
let emailUsed;
let skipped=[];
let answered=new Set();

// ✅ ENTER
function handleKey(e){
if(e.key==="Enter"){
e.preventDefault();
checkAnswer();
}
}

async function startGame(){

const email=document.getElementById("email").value.toLowerCase();

// domínio
if(!DOMAINS.some(d=>email.endsWith(d))){
document.getElementById("msg").innerText="Email inválido";
return;
}

// 🔒 checar duplicado
const cfg = await getConfig();

if(cfg.usedEmails.includes(email)){
document.getElementById("msg").innerText="Você já jogou!";
return;
}

sounds=window.firebaseSounds;
emailUsed=email;
startTime=Date.now();

document.getElementById("startScreen").style.display="none";
document.getElementById("gameScreen").style.display="block";

playSound();
}

function playSound(){
const audio=document.getElementById("audio");
audio.src="Sons/som"+sounds[index].id+".mp3";

document.getElementById("progress").innerText=
"Som "+(index+1)+" de "+sounds.length;

audio.play();
}

function normalize(t){
return t.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9\s]/g,"")
.trim();
}

function checkAnswer(){

const words=normalize(document.getElementById("answer").value).split(" ");
const valid=sounds[index].answers.map(a=>normalize(a));

let ok=false;

for(let v of valid){
if(words.includes(v)){ ok=true; break; }
}

if(ok){
score++;
answered.add(index);
next();
}else{
document.getElementById("msgGame").innerText="❌ tente novamente";
}
}

function skip(){
if(!skipped.includes(index)) skipped.push(index);
next();
}

function giveUp(){
skips++; extraTime+=120;
answered.add(index);
next();
}

function next(){

if(answered.size>=sounds.length){
finish();
return;
}

let found=false;

for(let i=index+1;i<sounds.length;i++){
if(!answered.has(i)){ index=i; found=true; break;}
}

if(!found && skipped.length>0){
index=skipped.shift();
if(answered.has(index)){ next(); return;}
found=true;
}

if(!found){ finish(); return;}

document.getElementById("answer").value="";
document.getElementById("msgGame").innerText="";
playSound();
}

async function finish(){

const total = Math.floor((Date.now()-startTime)/1000)+extraTime;

// ✅ salvar ranking + email
await addDoc(collection(db,"ranking"),{
email: emailUsed,
score: score,
totalTime: total
});

// ✅ salvar email usado
const cfgRef = doc(db,"config","settings");
const cfg = await getConfig();

cfg.usedEmails.push(emailUsed);

await updateDoc(cfgRef,{ usedEmails: cfg.usedEmails });

document.getElementById("msgGame").innerText =
"Finalizado! Pontos: "+score;

loadRanking();
}

</script>

<footer style="position:fixed; bottom:5px; right:10px; color:gray;">
Zari! Versão 1.4.0
</footer>

</body>
</html>
