<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quiz de Sons</title>

<style>
html, body {
  height: 100%;
}

body {
  margin: 0;
  font-family: Arial;
  display: flex;
  min-height: 100vh;
}

.center {
  width: 40%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f3f3f3;
}

.left {
  width: 30%;
  background: #222;
  color: white;
  padding: 15px;
}

.right {
  width: 30%;
  background: #111;
  color: white;
  padding: 15px;
}


.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 300px;
  text-align: center;
}

button, input {
  width: 100%;
  margin-top: 10px;
  margin-bottom: 10px;
  padding: 10px;

  border: 1px solid #ccc;
  border-radius: 6px;

  font-size: 14px;
  outline: none;
}

input:focus {
  border-color: #00FF5A;
  box-shadow: 0 0 5px #00FF5A;
}


.send-btn {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: black;
  color: #00FF5A; /* verde Team6 */
  font-size: 20px;
  border: none;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.send-btn:hover {
  transform: scale(1.1);
  background: #111;
}
  
</style>
</head>

<body>

<!-- ESQUERDA -->

<div class="left">
  <h3>📜 Regras</h3>
  <p>
    - Identifique 10 sons<br>
    - Pode tentar quantas vezes quiser<br>
    - Pode pular<br>
    - Desistir adiciona +2min<br>
    - Mais acertos vence<br>
    - Empate: menor tempo
  </p>
</div>

<div class="center">
  <div class="card">

    <div id="startScreen">
      <h2>Quiz de Sons</h2>
      <input id="email" placeholder="Seu email corporativo">
      <button onclick="startGame()">Jogar</button>
    </div>

    <div id="gameScreen" style="display:none">
      <h3>Som</h3>

      <button onclick="playSound()">🔊 Ouvir novamente</button>
      
      <p id="progress"></p>

      <audio id="audio"></audio>

      <!-- INPUT + BOTÃO RESPONDER -->
      <div style="display:flex; gap:10px; align-items:center;">
        <input id="answer" placeholder="Digite seu palpite" style="flex:1;">
        <button class="send-btn" onclick="checkAnswer()">➤</button>
      </div>

      <!-- BOTÕES EMBAIXO -->
      <div style="display:flex; justify-content:space-between; gap:15px;">
      <button onclick="skip()">Pular</button>
      <button onclick="giveUp()">Desistir (+2min)</button>
    </div>

      <p id="msg"></p>
    </div>

  </div>
</div>

<div class="right">
  <h3>🏆 Ranking</h3>
  <ul id="ranking"></ul>
</div>


<script>
  
const DOMAINS = ["@teamsix.tech", "@innovsoftware.com.br", "@yahoo.com.br"];

const sounds = [
  { src: "Boi.mp3", answers: ["Boi"] },
  { src: "Cobra Cascavel.mp3", answers: ["Cobra Cascavel", "Cobra", "Cascavel"] },
  { src: "FogosArtificio.mp3", answers: ["Fogos de Artificio", "Fogos de Artifício", "buscapé", "buscape", "foguete"] },
  { src: "Fogueira.mp3", answers: ["Fogueira","Fogo"] },
  { src: "Hino Nacional Brasil.mp3", answers: ["Hino Nacional Brasileiro", "Hino Nacional do Brasil", "Hino Nacional"] },
  { src: "Pato.mp3", answers: ["Pato"] },
  { src: "Pipoca estourando.mp3", answers: ["Pipoca estourando", "Pipoca"] },
  { src: "Sanfona.mp3", answers: ["Sanfona"] },
  { src: "URNA ELETRÔNICA.mp3", answers: ["URNA ELETRÔNICA", "URNA ELETRONICA"] },
  { src: "triangulo.mp3", answers: ["Triangulo"] },  
];

let index = 0;
let score = 0;
let skips = 0;
let extraTime = 0;
let startTime = null;
let emailUsed = "";
let finished = false;
let skippedSounds = [];
let answeredSounds = new Set();
  
function startGame() {
  const email = document.getElementById("email").value.toLowerCase();

  // ✅ valida domínio

  if (!DOMAINS.some(domain => email.endsWith(domain))) {
    const msg = document.getElementById("msg");
    msg.style.color = "red";
    msg.textContent = "❌ Email inválido! Use um email corporativo válido.";
    return;
  }

  // ✅ verifica se já jogou
  const used = JSON.parse(localStorage.getItem("usedEmails") || "[]");

  if (used.includes(email)) {
    const msg = document.getElementById("msg");
    msg.style.color = "red";
    msg.textContent = "⚠️ Este email já participou do jogo.";
    return;
  }

  emailUsed = email;
  startTime = Date.now();

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";

  playSound();
}
  
function normalize(text) {
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function playSound() {
  if (finished) return;

  const audio = document.getElementById("audio");

  audio.src = sounds[index].src;

  //Progresso
  document.getElementById("progress").textContent =
  `🎯 Som ${index + 1} de ${sounds.length}`;

  audio.onerror = () => {
    document.getElementById("msg").textContent =
      "⚠️ Não foi possível reproduzir esse som. Você pode pular ou tentar novamente.";
  };

  audio.play().catch(() => {
    document.getElementById("msg").textContent =
      "🔊 Clique novamente ou verifique o áudio.";
  });
}

  
function checkAnswer() {
  if (finished) return;

  const msg = document.getElementById("msg");

  const guess = normalize(document.getElementById("answer").value);

  const correctAnswers = sounds[index].answers.map(a => normalize(a));

  if (correctAnswers.some(ans => guess.includes(ans))) {
    answeredSounds.add(index);
    score++;
    msg.style.color = "green";
    msg.textContent = "🎉 Acertou!";

    document.getElementById("answer").value = "";

    next();
  } else {
    msg.style.color = "orange";
    msg.textContent = "💪 Continue tentando!";
  }
}
  
function skip() {
  if (!skippedSounds.includes(index)) {
    skippedSounds.push(index);
  }
  next();
}

function giveUp() {
  skips++;
  extraTime += 120;

  answeredSounds.add(index); // ✅ considera como finalizado

  next();
}


function next() {

  // ✅ PRIMEIRO: verifica se terminou
  if (answeredSounds.size >= sounds.length) {
    finish();
    return;
  }

  let found = false;

  // ✅ procura próximo não respondido na lista principal
  for (let i = index + 1; i < sounds.length; i++) {
    if (!answeredSounds.has(i)) {
      index = i;
      found = true;
      break;
    }
  }

  // ✅ se não achou → tenta os pulados
  if (!found && skippedSounds.length > 0) {
    index = skippedSounds.shift();

    if (answeredSounds.has(index)) {
      next();
      return;
    }

    found = true;
  }

  // ✅ segurança extra (caso extremo)
  if (!found) {
    finish();
    return;
  }

  document.getElementById("answer").value = "";
  document.getElementById("msg").textContent = "";

  playSound();
}
  
function finish() {
  if (finished) return; 

  finished = true;

  const audio = document.getElementById("audio");
  audio.pause();
  audio.currentTime = 0;

  const baseTime = Math.floor((Date.now() - startTime) / 1000);
  const totalTime = baseTime + extraTime;

  const name = emailUsed.split("@")[0];

  let ranking = JSON.parse(localStorage.getItem("ranking") || "[]");

  ranking.push({
    name,
    score,
    skips,
    baseTime,
    extraTime,
    totalTime
  });

  ranking.sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    if (a.totalTime !== b.totalTime) return a.totalTime - b.totalTime;
    return a.skips - b.skips;
  });

  localStorage.setItem("ranking", JSON.stringify(ranking));

  let used = JSON.parse(localStorage.getItem("usedEmails") || "[]");
  used.push(emailUsed);
  localStorage.setItem("usedEmails", JSON.stringify(used));

  document.getElementById("msg").innerHTML =
    `🏁 <strong>Finalizado!</strong><br>
     ✅ Acertos: ${score}<br>
     ❌ Desistências: ${skips}<br>
     ⏱ Tempo total: ${totalTime}s`;

  loadRanking();
  document.getElementById("progress").textContent = "✅ Finalizado";
  document.getElementById("answer").disabled = true;
  document.querySelectorAll("button").forEach(btn => btn.disabled = true);
}

function loadRanking() {
  const list = document.getElementById("ranking");
  list.innerHTML = "";

  let ranking = JSON.parse(localStorage.getItem("ranking") || "[]");

  ranking.forEach((p, i) => {

    let medal = "";
    if (i === 0) medal = "🥇";
    else if (i === 1) medal = "🥈";
    else if (i === 2) medal = "🥉";

    const li = document.createElement("li");

    li.textContent =
      `${medal} ${p.name} | ${p.score} acertos | ${p.skips} desist. | ${p.totalTime}s`;

    list.appendChild(li);
  });
}

loadRanking();

function resetGame() {
  const senha = prompt("Digite a senha:");

  if (senha === "MZari") { 
    localStorage.clear();
    location.reload();
  } else {
    alert("Senha incorreta");
  }
}
  
</script>

<!-- ✅ LOGO CENTRAL -->
<footer style="
  position: fixed; 
  bottom: 10px; 
  left: 50%; 
  transform: translateX(-50%);
">
  <img 
    src="Logotipo Original Completo Preto e Verde.png" 
    style="height: 40px; opacity: 0.8;"
  >
</footer>

<!-- ✅ VERSÃO NO CANTO DIREITO -->
<footer style="
  position: fixed;
  bottom: 5px;
  right: 10px;
  font-size: 12px;
  color: gray;
  opacity: 0.7;
"> 
  By: Zari! - Versão 1.0.6
</footer>

<button onclick="resetGame()" style="
  position: fixed;
  bottom: 10px;
  left: 10px;
  padding: 8px 12px;
  background: black;
  color: #00FF5A;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  opacity: 0.6;
  width: auto;
">
  ⚙ Reset
</button>

  
</body>
</html>
