<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Quiz de Sons</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: 'Montserrat', sans-serif;
}

body {
  display: flex;
  min-height: 100vh;
  background: #f3f3f3;
}

.left, .right {
  width: 30%;
  color: white;
  padding: 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

.left {
  background: linear-gradient(180deg, #1c1c1c, #000);
  justify-content: space-between; /* ✅ mantém versão no final */
}

.right {
  background: linear-gradient(180deg, #050505, #000);
}

.ranking-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.ranking-icon {
  height: 28px;
}

.ranking-title {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 1px;
}
  
.center {
  width: 40%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.center-container {
  text-align: center;
}

.main-icon {
  height: 60px;
  margin-bottom: 10px;
}

.main-title {
  font-size: 32px;
  margin: 5px 0;
  color: #1c1c1c;
}

.main-subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 20px;
}  

  
.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 340px;
  text-align: center;
}

/* ✅ versão no rodapé esquerdo */
.footer-version {
  color: gray;
  font-size: 12px;
  margin-top: auto;
}

.footer-logo {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

.footer-logo img {
  height: 35px;
  opacity: 0.85;
}  

/* ✅ reset canto inferior direito */
.footer-reset {
  position: fixed;
  bottom: 10px;
  right: 10px;
  z-index: 10;
}

.reset-panel {
  display: none;
  margin-top: 8px;
}

.reset-panel.active {
  display: block;
}

button {
  margin-top: 10px;
  padding: 10px;
  cursor: pointer;
}

/* ===== REGRAS MODERNAS ===== */

/* HEADER REGRAS */
.rules-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.rules-icon {
  height: 24px;
}

.rules-title {
  font-weight: 700;
  letter-spacing: 1px;
}

/* ITEM DA REGRA */
.rule-item {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 12px;
  border-radius: 12px;

  background: rgba(0, 255, 90, 0.05);

  margin-bottom: 12px;
}

/* CAIXA DO ÍCONE */
.rule-icon-box {
  width: 48px;
  height: 48px;
  min-width: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;

  background: linear-gradient(135deg, #00ff5a, #008f3a);
}

/* IMAGEM DENTRO DO ÍCONE */
.rule-icon-box img {
  width: 70%;
  height: 70%;
  object-fit: contain;
}

/* TEXTO */
.rule-content {
  display: flex;
  flex-direction: column;
}

.rule-title-item {
  font-weight: 600;
  font-size: 14px;
  color: #fff;
}

.rule-subtitle {
  font-size: 12px;
  color: #bbb;
  margin-top: 3px;
}
  
</style>
</head>

<body>

<!-- ESQUERDA -->
<div class="rules-header">
  <img src="Icons/regras.png" class="rules-icon" />
  <span class="rules-title">REGRAS</span>
</div>

<!-- ITEM 1 -->
<div class="rule-item">
  <div class="rule-icon-box">
    <img src="Icons/som.png">
  </div>

  <div class="rule-content">
    <div class="rule-title-item">Identifique 6 sons</div>
    <div class="rule-subtitle">
      ÚNICA tentativa, escute atentamente cada som e tente adivinhar!
    </div>
  </div>
</div>

  
  <!-- ✅ versão fixa em baixo -->
  <div class="footer-version">
    Zari! Versão 1.4.5
  </div>
</div>

<!-- CENTRO -->
<div class="center">
  <div class="center-container">

    <!-- ✅ ÍCONE -->
    <img src="Icons/som.png" class="main-icon" />

    <!-- ✅ TÍTULO -->
    <h1 class="main-title">Quiz de Sons</h1>

    <!-- ✅ SUBTÍTULO -->
    <p class="main-subtitle">Escute. Identifique. Única chance!</p>

    <!-- CARD -->
    <div class="card">

    <input id="email" placeholder="Seu email" />
    <button id="startBtn">Jogar</button>

    <button id="replayBtn">🔊 Ouvir</button>
    <p id="progress"></p>

    <button id="replayBtn" disabled>🔊 Ouvir</button>
    
    <input id="answer" placeholder="Resposta" disabled>
    <button id="answerBtn" disabled>Enviar</button>

    <p id="gameMessage"></p>

    </div> <!-- card -->

  </div> <!-- center-container -->
</div>

<!-- DIREITA -->
<div class="right">
  <div class="ranking-header">
  <img src="Icons/trofeu.png" class="ranking-icon" />
  <span class="ranking-title">RANKING</span>
</div>
  <ul id="ranking"></ul>
</div>

<!-- ✅ RESET -->
<div class="footer-reset">
  <button id="toggleResetBtn">⚙ Reset</button>

  <div id="resetPanel" class="reset-panel">
    <input id="resetPasswordInput" type="password" placeholder="Senha" />
    <button id="confirmResetBtn">Confirmar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getStorage,
  ref,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ✅ CONFIG */
const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "quiz-de-sons.firebaseapp.com",
  projectId: "quiz-de-sons",
  storageBucket: "quiz-de-sons.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

/* ✅ ELEMENTOS */
const audio = document.getElementById("audio");
const emailInput = document.getElementById("email");
const startBtn = document.getElementById("startBtn");
const replayBtn = document.getElementById("replayBtn");
const answerInput = document.getElementById("answer");
const answerBtn = document.getElementById("answerBtn");
const gameMessage = document.getElementById("gameMessage");

/* ✅ EMAIL PERMITIDO */
const DOMAINS = ["@teamsix.tech", "@innovsoftware.com.br", "@yahoo.com.br"];

function isValidEmail(email) {
  return DOMAINS.some(domain => email.endsWith(domain));
}

/* ✅ DADOS */
let sounds = [];
let index = 0;

/* ✅ CARREGA SONS */
async function loadSounds() {
  const snap = await getDocs(collection(db, "sounds"));
  snap.forEach(doc => {
    sounds.push(doc.data());
  });
}

/* ✅ TOCAR ÁUDIO */
async function playSound() {
  try {
    const soundName = sounds[index].name;

    const soundRef = ref(storage, `sounds/${soundName}.mp3`);
    const url = await getDownloadURL(soundRef);

    audio.src = url;
    await audio.play();

    console.log("tocando:", soundName);

  } catch (err) {
    console.error(err);
    alert("Erro ao tocar som");
  }
}

/* ✅ INICIAR JOGO COM VALIDAÇÃO */
const answerInput = document.getElementById("answer");
const answerBtn = document.getElementById("answerBtn");

startBtn.onclick = () => {
  const email = emailInput.value.trim().toLowerCase();

  if (!isValidEmail(email)) {
    gameMessage.textContent = "Email inválido ou não permitido";
    return;
  }

  if (!sounds.length) {
    gameMessage.textContent = "Carregando sons, aguarde...";
    return;
  }

  // ✅ LIBERA OS CONTROLES
  replayBtn.disabled = false;
  answerInput.disabled = false;
  answerBtn.disabled = false;

  // ✅ BLOQUEIA EMAIL E BOTÃO JOGAR
  emailInput.disabled = true;
  startBtn.disabled = true;

  gameMessage.textContent = "Jogo iniciado! Ouça o som";

  playSound();
};

/* ✅ REPLAY */
replayBtn.onclick = playSound;

/* ✅ RESET UI */
const toggleResetBtn = document.getElementById("toggleResetBtn");
const resetPanel = document.getElementById("resetPanel");

toggleResetBtn.onclick = () => {
  resetPanel.classList.toggle("active");
};

/* ✅ INIT */
loadSounds();

gameMessage.textContent = "Digite seu email para iniciar";  
  
</script>

<div class="footer-logo">
  <img src="logo-teamsix.png" alt="Teamsix">
</div>
  
</body>
</html>
