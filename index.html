<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quiz de Sons</title>

<style>
html, body {
  height: 100%;
}

body {
  margin: 0;
  font-family: Arial;
  display: flex;
  min-height: 100vh;
}

.center {
  width: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f3f3f3;
}

.left {
  width: 25%;
  background: #222;
  color: white;
  padding: 15px;
}

.right {
  width: 25%;
  background: #111;
  color: white;
  padding: 15px;
}


.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 300px;
  text-align: center;
}

button, input {
  width: 100%;
  margin-top: 10px;
  margin-bottom: 10px; /* 👈 ADICIONE ESTA LINHA */
  padding: 8px;
}
</style>
</head>

<body>

<!-- ESQUERDA -->

<div class="left">
  <h3>📜 Regras</h3>
  <p>
    - Identifique 10 sons<br>
    - Pode tentar quantas vezes quiser<br>
    - Pode pular<br>
    - Desistir adiciona +2min<br>
    - Mais acertos vence<br>
    - Empate: menor tempo
  </p>
</div>

<div class="center">
  <div class="card">

    <div id="startScreen">
      <h2>Quiz de Sons</h2>
      <input id="email" placeholder="Seu email corporativo">
      <button onclick="startGame()">Jogar</button>
    </div>

    <div id="gameScreen" style="display:none">
      <h3>Som</h3>

      <audio id="audio"></audio>

      <!-- INPUT + BOTÃO RESPONDER -->
      <div style="display:flex; gap:10px;">
        <input id="answer" placeholder="Digite seu palpite" style="flex:1;">
        <button onclick="checkAnswer()" style="width:120px;">Responder</button>
      </div>

      <!-- BOTÕES EMBAIXO -->
      <div style="display:flex; justify-content:space-between;">
        <button onclick="skip()">Pular</button>
        <button onclick="giveUp()">Desistir (+2min)</button>
      </div>

      <p id="msg"></p>
    </div>

  </div>
</div>

<div class="right">
  <h3>🏆 Ranking</h3>
  <ul id="ranking"></ul>
</div>


<script>
  
const DOMAINS = ["@teamsix.tech", "@innovsoftware.com.br", "@yahoo.com.br"];

const sounds = [
  { src: "Boi.mp3", answers: ["Boi"] },
  { src: "Cobra Cascavel.mp3", answers: ["Cobra Cascavel", "Cobra", "Cascavel"] },
  { src: "FogosArtificio.mp3", answers: ["Fogos de Artificio", "Fogos de Artifício", "buscapé", "buscape", "foguete"] },
  { src: "Fogueira.mp3", answers: ["Fogueira","Fogo"] },
  { src: "Hino Nacional Brasil.mp3", answers: ["Hino Nacional Brasileiro", "Hino Nacional do Brasil", "Hino Nacional"] },
  { src: "Pato.mp3", answers: ["Pato"] },
  { src: "Pipoca estourando.mp3", answers: ["Pipoca estourando", "Pipoca"] },
  { src: "Sanfona.mp3", answers: ["Sanfona"] },
  { src: "URNA ELETRÔNICA.mp3", answers: ["URNA ELETRÔNICA", "URNA ELETRONICA"] },
  { src: "triangulo.mp3", answers: ["Triangulo"] },  
];

let index = 0;
let score = 0;
let skips = 0;
let extraTime = 0;
let startTime = null;
let emailUsed = "";
let finished = false;
  
function startGame() {
  const email = document.getElementById("email").value.toLowerCase();

  // ✅ valida domínio

  if (!DOMAINS.some(domain => email.endsWith(domain))) {
    const msg = document.getElementById("msg");
    msg.style.color = "red";
    msg.textContent = "❌ Email inválido! Use um email corporativo válido.";
    return;
  }

  // ✅ verifica se já jogou
  const used = JSON.parse(localStorage.getItem("usedEmails") || "[]");

  if (used.includes(email)) {
    alert("Você já jogou!");
    return;
  }

  emailUsed = email;
  startTime = Date.now();

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";

  playSound();
}
  
function normalize(text) {
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function playSound() {
  if (finished) return;

  const audio = document.getElementById("audio");

  audio.src = sounds[index].src;

  audio.onerror = () => {
    document.getElementById("msg").textContent =
      "⚠️ Não foi possível reproduzir esse som. Você pode pular ou tentar novamente.";
  };

  audio.play().catch(() => {
    document.getElementById("msg").textContent =
      "🔊 Clique novamente ou verifique o áudio.";
  });
}

  
function checkAnswer() {
  if (finished) return;

  const guess = normalize(document.getElementById("answer").value);

  const correctAnswers = sounds[index].answers.map(a => normalize(a));

  if (correctAnswers.includes(guess)) {
      score++;
    document.getElementById("msg").textContent = "🎉 Acertou!";
    next();
  } else {
    document.getElementById("msg").textContent =
      "💪 Continue tentando!";
  }
}

function skip() {
  next();
}

function giveUp() {
  skips++;
  extraTime += 120;
  next();
}

function next() {
  index++;
  document.getElementById("answer").value = "";

  if (index >= sounds.length) {
    finish();
  } else {
    playSound();
  }
}

function finish() {
  if (finished) return; 

  finished = true;

  const baseTime = Math.floor((Date.now() - startTime) / 1000);
  const totalTime = baseTime + extraTime;

  const name = emailUsed.split("@")[0];

  let ranking = JSON.parse(localStorage.getItem("ranking") || "[]");

  ranking.push({
    name,
    score,
    skips,
    baseTime,
    extraTime,
    totalTime
  });

  ranking.sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    if (a.totalTime !== b.totalTime) return a.totalTime - b.totalTime;
    return a.skips - b.skips;
  });

  localStorage.setItem("ranking", JSON.stringify(ranking));

  let used = JSON.parse(localStorage.getItem("usedEmails") || "[]");
  used.push(emailUsed);
  localStorage.setItem("usedEmails", JSON.stringify(used));

  document.getElementById("msg").textContent =
    `Fim! ${score} acertos | ${skips} desistências | ${totalTime}s`;

  loadRanking();
}

function loadRanking() {
  const list = document.getElementById("ranking");
  list.innerHTML = "";

  let ranking = JSON.parse(localStorage.getItem("ranking") || "[]");

  ranking.forEach(p => {
    const li = document.createElement("li");
    li.textContent =
      `${p.name} | ${p.score} acertos | ${p.skips} desist. | ${p.totalTime}s`;
    list.appendChild(li);
  });
}

loadRanking();
</script>

<footer style="position: fixed; bottom: 5px; right: 10px; font-size: 12px; color: gray;">
  Versão 1.0.3
</footer>

</body>
</html>
