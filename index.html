<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quiz de Sons</title>

<!-- ✅ FONTE CORRETA -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: 'Montserrat', sans-serif;
}

body {
  display: flex;
  min-height: 100vh;
}

.left, .right {
  width: 30%;
  color: white;
  padding: 20px;
}

.left { background: linear-gradient(#1c1c1c, #000); }
.right { background: #000; }

.center {
  width: 40%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f3f3f3;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 10px;
  width: 320px;
  text-align: center;
}

button, input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

.send-btn {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #00FF5A;
  color: black;
  font-weight: bold;
  border: none;
  cursor: pointer;
}

.send-btn:hover {
  transform: scale(1.1);
}
</style>
</head>

<body>

<div class="left">
<h3>📜 Regras</h3>
<p>
Identifique 10 sons<br>
Pode tentar quantas vezes quiser<br>
Pode pular<br>
Desistir +2min<br>
Mais acertos vence<br>
Empate: menor tempo
</p>
</div>

<div class="center">
<div class="card">

<div id="startScreen">
<h2>Quiz de Sons</h2>
<input id="email" placeholder="Seu email corporativo">
<button onclick="startGame()">Jogar</button>
<p id="msg" style="color:red;"></p>
</div>

<div id="gameScreen" style="display:none">

<button onclick="playSound()">🔊 Ouvir</button>
<p id="progress"></p>

<audio id="audio"></audio>

<div style="display:flex">
<input id="answer" onkeypress="handleKey(event)">
<button class="send-btn" onclick="checkAnswer()">➤</button>
</div>

<div style="display:flex; gap:10px;">
<button onclick="skip()">Pular</button>
<button onclick="giveUp()">Desistir</button>
</div>

<p id="msgGame"></p>

</div>

</div>
</div>

<div class="right">
<h3>🏆 Ranking</h3>
<ul id="ranking"></ul>
</div>

<!-- ✅ FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"SUA_KEY",
  authDomain:"quiz-de-sons.firebaseapp.com",
  projectId:"quiz-de-sons"
});

window.db = getFirestore(app);

async function loadSounds() {
  const snapshot = await getDocs(collection(db,"sounds"));
  const data = [];

  snapshot.forEach(doc=>{
    data.push({ id:Number(doc.id), ...doc.data() });
  });

  data.sort((a,b)=>a.id-b.id);
  window.firebaseSounds = data;
}
loadSounds();

async function loadRanking(){
  const snapshot = await getDocs(collection(db,"ranking"));
  const list = document.getElementById("ranking");
  list.innerHTML="";

  const data=[];

  snapshot.forEach(doc=>data.push(doc.data()));

  data.sort((a,b)=>{
    if(b.score!==a.score) return b.score-a.score;
    return a.totalTime-b.totalTime;
  });

  data.slice(0,10).forEach((p,i)=>{
    const li=document.createElement("li");
    li.innerText=`${i+1}. ${p.name} | ${p.score} pts`;
    list.appendChild(li);
  });
}

window.loadRanking = loadRanking;
</script>

<script>

const DOMAINS = ["@teamsix.tech","@innovsoftware.com.br","@yahoo.com.br"];

let sounds=[];
let index=0;
let score=0;
let skips=0;
let extraTime=0;
let startTime;
let emailUsed;
let finished=false;
let skippedSounds=[];
let answered=new Set();

function handleKey(e){
if(e.key==="Enter") checkAnswer();
}

function startGame(){

const email=document.getElementById("email").value.toLowerCase();

if(!DOMAINS.some(d=>email.endsWith(d))){
document.getElementById("msg").innerText="Email inválido!";
return;
}

if(!window.firebaseSounds){
alert("Carregando...");
return;
}

sounds=window.firebaseSounds;
emailUsed=email;
startTime=Date.now();

document.getElementById("startScreen").style.display="none";
document.getElementById("gameScreen").style.display="block";

playSound();
}

function playSound(){
const audio=document.getElementById("audio");
audio.src="Sons/som"+sounds[index].id+".mp3";

document.getElementById("progress").innerText=
"Som "+(index+1)+" de "+sounds.length;

audio.play();
}

function normalize(text){
return text.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9\s]/g,"")
.trim();
}

function checkAnswer(){

const guess=normalize(document.getElementById("answer").value);
const words=guess.split(" ");

const valid=sounds[index].answers.map(a=>normalize(a));

let correct=false;

for(let v of valid){
if(words.includes(v)){
correct=true;
break;
}
}

if(correct){
score++;
answered.add(index);
next();
}else{
document.getElementById("msgGame").innerText="❌ continue tentando";
}
}

function skip(){
if(!skippedSounds.includes(index)) skippedSounds.push(index);
next();
}

function giveUp(){
skips++;
extraTime+=120;
answered.add(index);
next();
}

function next(){

if(answered.size>=sounds.length){
finish();
return;
}

let found=false;

for(let i=index+1;i<sounds.length;i++){
if(!answered.has(i)){
index=i;
found=true;
break;
}
}

if(!found && skippedSounds.length>0){
index=skippedSounds.shift();
if(answered.has(index)){
next();
return;
}
found=true;
}

if(!found){
finish();
return;
}

document.getElementById("answer").value="";
document.getElementById("msgGame").innerText="";
playSound();
}

async function finish(){

finished=true;

const base=Math.floor((Date.now()-startTime)/1000);
const total=base+extraTime;

const name=emailUsed.split("@")[0];

// ✅ salva no Firebase
await addDoc(collection(db,"ranking"),{
name:name,
score:score,
totalTime:total
});

alert("Finalizado!\nPontuação:"+score);

// atualiza ranking
loadRanking();
}

loadRanking();

</script>

<footer style="position:fixed; bottom:10px; left:50%; transform:translateX(-50%);">
<img src="Logotipo Original Completo Preto e Verde.png" style="height:40px;">
</footer>

<footer style="position:fixed; bottom:5px; right:10px; color:gray;">
Zari! Versão 1.3.0
</footer>

</body>
</html>
