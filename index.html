<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Quiz de Sons</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: 'Montserrat', sans-serif;
}

body {
  display: flex;
  min-height: 100vh;
  background: #f3f3f3;
}

.left, .right {
  width: 30%;
  color: white;
  padding: 20px;
  box-sizing: border-box;
}

.left {
  background: linear-gradient(180deg, #1c1c1c, #000);
}

.right {
  background: linear-gradient(180deg, #050505, #000);
}

.center {
  width: 40%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 340px;
  text-align: center;
}

/* ✅ versão abaixo das regras */
.footer-version {
  margin-top: 20px;
  color: gray;
  font-size: 12px;
}

/* ✅ reset canto inferior direito */
.footer-reset {
  position: fixed;
  bottom: 10px;
  right: 10px;
}

.reset-panel {
  display: none;
}

.reset-panel.active {
  display: block;
}

.send-btn {
  width: 52px;
}

</style>
</head>

<body>

<div class="left">
  <div class="rules-block">
    <h3>📜 Regras</h3>
    <p>
      Identifique 10 sons<br>
      Pode tentar quantas vezes quiser<br>
      Pode pular<br>
      Desistir adiciona +2min<br>
      Mais acertos vence<br>
      Empate: menor tempo
    </p>

    <!-- ✅ versão aqui -->
    <div class="footer-version">Zari! Versão 1.4.3</div>
  </div>
</div>

<div class="center">
  <div class="card">
    <button id="replayBtn">🔊 Ouvir</button>
    <p id="progress"></p>

    <audio id="audio"></audio>

    <input id="answer" placeholder="Resposta">
    <button id="answerBtn">Enviar</button>

    <p id="gameMessage"></p>
  </div>
</div>

<div class="right">
  <h3>🏆 Ranking</h3>
  <ul id="ranking"></ul>
</div>

<!-- ✅ RESET NO LUGAR CERTO -->
<div class="footer-reset">
  <button id="toggleResetBtn">⚙ Reset</button>

  <div id="resetPanel" class="reset-panel">
    <input id="resetPasswordInput" type="password" placeholder="Senha">
    <button id="confirmResetBtn">Confirmar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getStorage,
  ref,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

// ✅ CONFIG
const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "quiz-de-sons.firebaseapp.com",
  projectId: "quiz-de-sons",
  storageBucket: "quiz-de-sons.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const audio = document.getElementById("audio");

let sounds = [];
let index = 0;

// ✅ CARREGA SONS
async function loadSounds() {
  const snap = await getDocs(collection(db, "sounds"));
  snap.forEach(doc => {
    sounds.push(doc.data());
  });
}

// ✅ TOCAR SOM (AGORA CERTO)
async function playSound() {
  try {
    const soundName = sounds[index].name;

    const soundRef = ref(storage, `sounds/${soundName}.mp3`);
    const url = await getDownloadURL(soundRef);

    audio.src = url;
    await audio.play();

    console.log("tocando:", soundName);

  } catch (err) {
    console.error(err);
    alert("Erro ao tocar som");
  }
}

document.getElementById("replayBtn").onclick = playSound;

loadSounds();

</script>

</body>
</html>
