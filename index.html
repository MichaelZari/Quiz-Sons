<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Quiz de Sons</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: 'Montserrat', sans-serif;
}

body {
  display: flex;
  min-height: 100vh;
  background: #f3f3f3;
}

.left, .right {
  width: 30%;
  color: white;
  padding: 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

.left {
  background: linear-gradient(180deg, #0a0a0a, #000);

  display: flex;
  flex-direction: column;

  justify-content: flex-start; /* ✅ começa no topo */
}

.right {
  background: linear-gradient(180deg, #050505, #000);
}

.ranking-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.ranking-icon {
  height: 28px;
}

.ranking-title {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 1px;
}
  
.center {
  width: 40%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.center-container {
  text-align: center;
}

.main-icon {
  height: 60px;
  margin-bottom: 10px;
}

.main-title {
  font-size: 32px;
  margin: 5px 0;
  color: #1c1c1c;
}

.main-subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 20px;
}  

  
.card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  width: 340px;
  text-align: center;

  /* 🔥 glow verde */
  box-shadow: 
    0 10px 25px rgba(0,0,0,0.1),
    0 0 25px rgba(0, 255, 90, 0.25);
}

/* ✅ versão no rodapé esquerdo */
.footer-version {
  color: gray;
  font-size: 12px;
  margin-top: auto;
}

.footer-logo {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

.footer-logo img {
  height: 35px;
  opacity: 0.85;
}  

/* ✅ reset canto inferior direito */
.footer-reset {
  position: fixed;
  bottom: 10px;
  right: 10px;
  z-index: 10;
}

.reset-panel {
  display: none;
  margin-top: 8px;
}

.reset-panel.active {
  display: block;
}

button {
  margin-top: 10px;
  padding: 10px;
  cursor: pointer;
}

/* ===== REGRAS MODERNAS ===== */

/* HEADER REGRAS */
.rules-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.rules-icon {
  height: 24px;
}

.rules-title {
  font-weight: 700;
  letter-spacing: 1px;
}

/* ITEM DA REGRA */
.rule-item {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 12px;
  border-radius: 12px;

  background: rgba(0, 255, 90, 0.05);

  margin-bottom: 12px;
}

/* CAIXA DO ÍCONE */
.rule-icon-box {
  width: 48px;
  height: 48px;
  min-width: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;

  background: linear-gradient(135deg, #00ff5a, #008f3a);
}

/* IMAGEM DENTRO DO ÍCONE */
.rule-icon-box img {
  width: 70%;
  height: 70%;
  object-fit: contain;
}

/* TEXTO */
.rule-content {
  display: flex;
  flex-direction: column;
}

.rule-title-item {
  font-weight: 600;
  font-size: 14px;
  color: #fff;
}

.rule-subtitle {
  font-size: 12px;
  color: #bbb;
  margin-top: 3px;
}

.start-btn {
  width: 100%;
  padding: 14px;
  margin-top: 12px;

  background: linear-gradient(135deg, #00ff5a, #008f3a);
  color: black;

  font-weight: 600;
  font-size: 15px;

  border: none;
  border-radius: 10px;

  cursor: pointer;
  transition: 0.2s;
}

.start-btn:hover {
  transform: scale(1.03);
  box-shadow: 0 0 12px rgba(0,255,90,0.5);
}


.rules-list {
  display: flex;
  flex-direction: column;
}

  
</style>
</head>

<body>

<!-- ESQUERDA -->
<div class="left">

  <div class="rules-header">
    <img src="Icons/regras.png" class="rules-icon" />
    <span class="rules-title">REGRAS</span>
  </div>

  <div class="rules-list">

    <div class="rule-item">
      <div class="rule-icon-box">
        <img src="Icons/som.png">
      </div>

      <div class="rule-content">
        <div class="rule-title-item">Identifique 6 sons</div>
        <div class="rule-subtitle">
          ÚNICA tentativa, escute atentamente cada som e tente adivinhar!
        </div>
      </div>
    </div>

  </div>

  <div class="footer-version">
    Zari! Versão 1.4.6
  </div>

</div>


<!-- CENTRO -->
<div class="center">
  <div class="center-container">

    <img src="Icons/som.png" class="main-icon" />

    <h1 class="main-title">Quiz de Sons</h1>
    <p class="main-subtitle">Escute. Identifique. Única chance!</p>

    <div class="card">

      <!-- ETAPA 1 -->
      <div id="startArea">
        <h3>Entre para começar</h3>
        <input id="email" placeholder="Seu email corporativo" />
        <button id="startBtn" class="start-btn">Jogar</button>
      </div>

      <!-- ETAPA 2 -->
      <div id="gameArea" style="display:none;">
        <button id="replayBtn">🔊 Ouvir</button>
        <input id="answer" placeholder="Resposta">
        <button id="answerBtn">Enviar</button>
        <button id="skipBtn">Pular</button>
        <button id="giveUpBtn">Desistir</button>
      </div>

      <p id="gameMessage"></p>

    </div>

  </div>
</div>


<!-- DIREITA -->
<div class="right">

  <div class="ranking-header">
    <img src="Icons/trofeu.png" class="ranking-icon" />
    <span class="ranking-title">RANKING</span>
  </div>

  <ul id="ranking"></ul>

</div>


<!-- RESET -->
<div class="footer-reset">
  <button id="toggleResetBtn">⚙ Reset</button>

  <div id="resetPanel" class="reset-panel">
    <input id="resetPasswordInput" type="password" placeholder="Senha" />
    <button id="confirmResetBtn">Confirmar</button>
  </div>
</div>

<!-- LOGO -->
<div class="footer-logo">
  <img src="logo-teamsix.png" alt="Teamsix">
</div>

</body>
</html>
