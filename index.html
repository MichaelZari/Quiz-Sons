<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Quiz de Sons</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: 'Montserrat', sans-serif;
}

body {
  display: flex;
  min-height: 100vh;
  background: #f3f3f3;
}

.left, .right {
  width: 30%;
  color: white;
  padding: 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

.left {
  background: linear-gradient(180deg, #1c1c1c, #000);
  justify-content: space-between; /* ✅ mantém versão no final */
}

.right {
  background: linear-gradient(180deg, #050505, #000);
}

.center {
  width: 40%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 340px;
  text-align: center;
}

/* ✅ versão no rodapé esquerdo */
.footer-version {
  color: gray;
  font-size: 12px;
  margin-top: auto;
}

/* ✅ reset canto inferior direito */
.footer-reset {
  position: fixed;
  bottom: 10px;
  right: 10px;
  z-index: 10;
}

.reset-panel {
  display: none;
  margin-top: 8px;
}

.reset-panel.active {
  display: block;
}

button {
  margin-top: 10px;
  padding: 10px;
  cursor: pointer;
}

</style>
</head>

<body>

<!-- ESQUERDA -->
<div class="left">
  <div>
    <h3>📜 Regras</h3>
    <p>
      Identifique 10 sons<br>
      Pode tentar quantas vezes quiser<br>
      Pode pular<br>
      Desistir adiciona +2min<br>
      Mais acertos vence<br>
      Empate: menor tempo
    </p>
  </div>

  <!-- ✅ versão fixa em baixo -->
  <div class="footer-version">
    Zari! Versão 1.4.4
  </div>
</div>

<!-- CENTRO -->
<div class="center">
  <div class="card">

    <input id="email" placeholder="Seu email" />
    <button id="startBtn">Jogar</button>

    <button id="replayBtn">🔊 Ouvir</button>
    <p id="progress"></p>

    <audio id="audio"></audio>

    <input id="answer" placeholder="Resposta">
    <button id="answerBtn">Enviar</button>

    <p id="gameMessage"></p>

  </div>
</div>

<!-- DIREITA -->
<div class="right">
  <h3>🏆 Ranking</h3>
  <ul id="ranking"></ul>
</div>

<!-- ✅ RESET -->
<div class="footer-reset">
  <button id="toggleResetBtn">⚙ Reset</button>

  <div id="resetPanel" class="reset-panel">
    <input id="resetPasswordInput" type="password" placeholder="Senha" />
    <button id="confirmResetBtn">Confirmar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getStorage,
  ref,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ✅ CONFIG */
const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "quiz-de-sons.firebaseapp.com",
  projectId: "quiz-de-sons",
  storageBucket: "quiz-de-sons.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

/* ✅ ELEMENTOS */
const audio = document.getElementById("audio");
const emailInput = document.getElementById("email");
const startBtn = document.getElementById("startBtn");
const replayBtn = document.getElementById("replayBtn");

/* ✅ EMAIL PERMITIDO */
const DOMAINS = ["@teamsix.tech", "@innovsoftware.com.br", "@yahoo.com.br"];

function isValidEmail(email) {
  return DOMAINS.some(domain => email.endsWith(domain));
}

/* ✅ DADOS */
let sounds = [];
let index = 0;

/* ✅ CARREGA SONS */
async function loadSounds() {
  const snap = await getDocs(collection(db, "sounds"));
  snap.forEach(doc => {
    sounds.push(doc.data());
  });
}

/* ✅ TOCAR ÁUDIO */
async function playSound() {
  try {
    const soundName = sounds[index].name;

    const soundRef = ref(storage, `sounds/${soundName}.mp3`);
    const url = await getDownloadURL(soundRef);

    audio.src = url;
    await audio.play();

    console.log("tocando:", soundName);

  } catch (err) {
    console.error(err);
    alert("Erro ao tocar som");
  }
}

/* ✅ INICIAR JOGO COM VALIDAÇÃO */
startBtn.onclick = () => {
  const email = emailInput.value.trim().toLowerCase();

  if (!isValidEmail(email)) {
    alert("Email inválido ou não permitido");
    return;
  }

  playSound();
};

/* ✅ REPLAY */
replayBtn.onclick = playSound;

/* ✅ RESET UI */
const toggleResetBtn = document.getElementById("toggleResetBtn");
const resetPanel = document.getElementById("resetPanel");

toggleResetBtn.onclick = () => {
  resetPanel.classList.toggle("active");
};

/* ✅ INIT */
loadSounds();

</script>

</body>
</html>
