<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quiz de Sons</title>

<!-- ✅ FONTE -->
https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  display: flex;
}

.center { width: 40%; display:flex; justify-content:center; align-items:center; background:#f3f3f3; }
.left { width:30%; background:#222; color:white; padding:15px; }
.right { width:30%; background:#111; color:white; padding:15px; }

.card {
  background:white;
  padding:20px;
  border-radius:10px;
  width:300px;
  text-align:center;
}

button,input {
  width:100%;
  padding:10px;
  margin:10px 0;
}

.send-btn {
  width:45px;
  height:45px;
  border-radius:50%;
  background:black;
  color:#00FF5A;
}
</style>
</head>

<body>

<div class="left">
<h3>📜 Regras</h3>
<p>
Identifique 10 sons<br>
Pode tentar quantas vezes quiser<br>
Pular permitido<br>
Desistir +2min<br>
Mais acertos vence
</p>
</div>

<div class="center">
<div class="card">

<div id="startScreen">
<h2>Quiz</h2>
<input id="email">
<button onclick="startGame()">Jogar</button>
</div>

<div id="gameScreen" style="display:none">

<button onclick="playSound()">🔊 Ouvir</button>
<p id="progress"></p>

<audio id="audio"></audio>

<div style="display:flex">
<input id="answer">
<button class="send-btn" onclick="checkAnswer()">➤</button>
</div>

<p id="msg"></p>

</div>

</div>
</div>

<div class="right">
<h3>🏆 Ranking</h3>
<ul id="ranking"></ul>
</div>

<!-- ✅ FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"SUA_KEY",
  authDomain:"quiz-de-sons.firebaseapp.com",
  projectId:"quiz-de-sons"
});

const db = getFirestore(app);

async function loadSounds() {
  const snapshot = await getDocs(collection(db,"sounds"));

  const data = [];

  snapshot.forEach(doc=>{
    data.push({ id:Number(doc.id), ...doc.data() });
  });

  data.sort((a,b)=>a.id-b.id);

  window.firebaseSounds = data;
}
loadSounds();
</script>

<script>

let sounds = [];
let index = 0;
let score = 0;
let finished = false;

function startGame(){

if(!window.firebaseSounds){
  alert("Carregando...");
  return;
}

sounds = window.firebaseSounds;

document.getElementById("startScreen").style.display="none";
document.getElementById("gameScreen").style.display="block";

playSound();
}

function playSound(){

const audio = document.getElementById("audio");

// ✅ SOM PADRÃO
audio.src = "Sons/som" + sounds[index].id + ".mp3";

document.getElementById("progress").textContent =
"Som "+(index+1)+" de "+sounds.length;

audio.play();
}

// ✅ NORMALIZA TEXTO
function normalize(text){
return text
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9\s]/g,"")
.trim();
}

// ✅ TOKENIZAÇÃO (EVITA ERRO DE SUFIXO)
function tokenize(text){
return normalize(text).split(" ");
}

function checkAnswer(){

const guess = document.getElementById("answer").value;
const words = tokenize(guess);

const validAnswers = sounds[index].answers.map(a=>normalize(a));

let correct = false;

for(let ans of validAnswers){

// ✅ precisa ser palavra isolada
if(words.includes(ans)){
correct = true;
break;
}

}

if(correct){
score++;
next();
}else{
document.getElementById("msg").textContent = "❌ tente novamente";
}

}

// ✅ AVANÇA
function next(){
index++;

document.getElementById("answer").value="";
document.getElementById("msg").textContent="";

if(index>=sounds.length){
finish();
return;
}

playSound();
}

// ✅ FINAL
function finish(){
finished=true;
alert("Pontuação: "+score);
}

</script>

<footer style="position:fixed; bottom:5px; right:10px;">
Versão 1.1.0
</footer>

</body>
</html>
